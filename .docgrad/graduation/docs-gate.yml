# docs-gate.yml — GitHub Actions workflow 範本（docgrad 產出，**不由 docgrad 安裝**）
#
# 要啟用：自行複製到 .github/workflows/docs-gate.yml 並調整。docgrad 絕不寫入 .github/。
#
# 這道 gate 就是「畢業」的內容：docgrad 是一次性的收斂工具，離開後由 CI 守住成果。
# 沒有它，收斂會自然衰減——oikos 收官當天就冒出新孤兒與缺日期的檔案，兩個月後仍在原地。

name: docs-gate

on:
  pull_request:
    paths:
      # 依你的 .docgrad.yml 的 docs_dirs / entry_files 調整
      - 'docs/**'
      - 'CLAUDE.md'
      - '.docgrad.yml'

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # freshness 要讀 git log 的真實日期，淺 clone 會失準

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # docgrad 腳本零依賴，Node ≥18 即可

      - name: 取得 docgrad
        run: git clone --depth 1 https://github.com/redtear1115/docgrad.git /tmp/docgrad

      - name: 跑 docs-gate
        env:
          DOCGRAD_DIR: /tmp/docgrad
        run: node .github/scripts/docs-gate.mjs --root .
        # exit 1 = 文件不合格；exit 2 = 環境問題（找不到 docgrad、腳本炸了）

# ── 也可以改用現成工具（docgrad 的腳本不是唯一解）──────────────────────────────
#
#   死鏈      lychee 或 markdown-link-check
#   格式      markdownlint
#   術語風格  Vale
#
# 這些工具在死鏈與格式上比 docgrad 成熟得多。docgrad 的腳本在兩件事上仍有差異化價值：
# 孤兒／可達性（從單一索引 transitive 走得到嗎）與入口檔 token 預算——這兩個是
# 「文件作為 agent context」特有的量測，一般 docs linter 不做。
